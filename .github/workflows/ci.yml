name: CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  frontend-lint:
    name: Frontend Lint (Informational)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Front-End/package-lock.json

      - name: Install dependencies
        working-directory: ./Front-End
        run: npm ci

      - name: Run ESLint
        working-directory: ./Front-End
        # We have 0 errors locally, so it shouldn't fail. 
        # Warnings are printed but don't fail the job by default.
        run: npm run lint

  backend-lint:
    name: Backend Ruff (Informational)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        # Match the version in requirements-dev.txt / pre-commit
        run: pip install ruff==0.4.4

      - name: Run Ruff Check
        working-directory: ./Back-End
        # --exit-zero ensures we see the warnings in GitHub logs without failing the PR
        run: ruff check . --exit-zero

  backend-test:
    name: Backend Pytest (Placeholder)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ./Back-End
        run: |
          pip install -r requirements-dev.txt
      
      - name: Run Pytest & Coverage
        working-directory: ./Back-End
        # We run the basic smoke test suite and fail CI if it crashes
        run: |
          pytest --cov

      - name: Run Architecture Validation
        working-directory: ./Back-End
        run: |
          python scripts/arch_check.py
